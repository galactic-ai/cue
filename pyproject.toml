[project]
name = "astro-cue"
description = "Nebular Emission Modeling"
authors = [
    { name = "Yijia Li", email = "yijia.li@northwestern.edu" },
]
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = { text = "MIT License" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dynamic = ["version"]
dependencies = [
    "scikit-learn",
    "scipy",
    "dill",
    "tqdm",

    # Older tested TensorFlow stack
    "tensorflow>=2.10,<2.12; python_version < '3.11'",
    "protobuf>=3.19,<3.20; python_version < '3.11'",
    "numpy>=1.21,<2; python_version < '3.11'",

    # Newer Python / newer TensorFlow stack
    "tensorflow>=2.18; python_version >= '3.11'",
    "protobuf>=3.20.3; python_version >= '3.11'",
    "numpy>=1.26; python_version >= '3.11'",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools.package-data]
"cue.data" = ["*.dat","*.pkl", "*.npy", "*.txt"]

[tool.coverage.run]
parallel = true
branch = true
source = ["cue"]
#omit = [
#    "docs/*",
#    "tests/*",
#    "*__init__*"
#]

[tool.coverage.paths]
source = ["src"]

#[project.urls]
#"Source" = "https://github.com/yi-jia-li/cue"
#"Bug Tracker" = "https://github.com/yi-jia-li/cue/issues"

[build-system]
requires = ["setuptools>=40.6.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

